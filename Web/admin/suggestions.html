<div id="suggestionsPage" data-role="page" class="page type-interior pluginConfigurationPage">

    <div class="content-primary">
      <h1>Content Suggestions</h1>
      <p>Review user suggestions, reject bad entries, approve requests, and mark content as added to library.</p>

      <table class="tblSuggestions">
        <thead>
          <tr>
            <th>User</th>
            <th>Type</th>
            <th>Title</th>
            <th>Status</th>
            <th>Duplicate</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="suggestionRows"></tbody>
      </table>
    </div>
  </div>
</div>
